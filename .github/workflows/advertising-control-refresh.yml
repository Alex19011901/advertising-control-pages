name: Advertising Control Refresh

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: advertising-control-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Yandex Direct report
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_CLIENT_LOGIN: e-20027205
        run: python scripts/fetch_direct.py

      - name: Build dashboard JSON
        run: python scripts/build_dashboard.py

      - name: Save refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/direct_status.json data/direct_report.tsv
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
          else
            git commit -m "Refresh Advertising Control data"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p public-site
          cp index.html public-site/index.html
          cp .nojekyll public-site/.nojekyll
          cp -R assets public-site/assets
          cp -R data public-site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
