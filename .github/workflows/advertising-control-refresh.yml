name: Advertising Control Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "10 * * * *"
  push:
    paths:
      - ".github/workflows/advertising-control-refresh.yml"
      - "scripts/fetch_direct.py"
      - "scripts/direct_tracking_readonly.py"
      - "scripts/summarize_direct_tracking.py"
      - "scripts/audit_direct_source.py"
      - "scripts/fetch_metrika_52597240.py"
      - "scripts/build_dashboard.py"
      - "scripts/build_dashboard_with_metrika.py"
      - "tests/test_attribution.py"
      - "tests/test_metrika_client_join.py"
      - "tests/test_fetch_metrika_52597240.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: advertising-control-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test exact attribution logic
        run: python -m unittest tests.test_attribution tests.test_metrika_client_join tests.test_fetch_metrika_52597240 -v

      - name: Fetch Yandex Direct report
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_CLIENT_LOGIN: e-20027205
          YANDEX_DIRECT_DATE_FROM: "2026-09-05"
        run: python scripts/fetch_direct.py

      - name: Read current Direct tracking configuration
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_CLIENT_LOGIN: e-20027205
        run: |
          python scripts/direct_tracking_readonly.py
          python scripts/summarize_direct_tracking.py

      - name: Audit Direct source completeness
        run: python scripts/audit_direct_source.py

      - name: Fetch Yandex Metrika 52597240 logs
        env:
          YANDEX_METRIKA_READ_TOKEN: ${{ secrets.YANDEX_METRIKA_READ_TOKEN }}
          YANDEX_METRIKA_TARGET_COUNTER: "52597240"
        run: |
          yesterday="$(TZ=Europe/Moscow date -d 'yesterday' +%F)"
          python scripts/fetch_metrika_52597240.py --counter-id 52597240 --date1 2026-09-05 --date2 "$yesterday" --poll-seconds 5 --max-polls 90

      - name: Build dashboard JSON
        env:
          LEAD_CONTROL_ADVERTISING_URL: https://alex19011901.github.io/lead-control-pages/advertising_leads.json
          YANDEX_METRIKA_EXPORT: data/metrika_52597240.json
          YANDEX_METRIKA_TARGET_COUNTER: "52597240"
        run: python scripts/build_dashboard_with_metrika.py

      - name: Save refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/advertising-control-refresh
          cp data/dashboard.json /tmp/advertising-control-refresh/dashboard.json
          cp data/direct_status.json /tmp/advertising-control-refresh/direct_status.json
          cp data/direct_report.tsv /tmp/advertising-control-refresh/direct_report.tsv
          cp data/direct_tracking_diagnostic.json /tmp/advertising-control-refresh/direct_tracking_diagnostic.json
          cp data/direct_tracking_summary.json /tmp/advertising-control-refresh/direct_tracking_summary.json
          cp data/direct_source_audit.json /tmp/advertising-control-refresh/direct_source_audit.json
          cp data/metrika_52597240.json /tmp/advertising-control-refresh/metrika_52597240.json
          cp data/metrika_status.json /tmp/advertising-control-refresh/metrika_status.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/advertising-control-refresh/dashboard.json data/dashboard.json
          cp /tmp/advertising-control-refresh/direct_status.json data/direct_status.json
          cp /tmp/advertising-control-refresh/direct_report.tsv data/direct_report.tsv
          cp /tmp/advertising-control-refresh/direct_tracking_diagnostic.json data/direct_tracking_diagnostic.json
          cp /tmp/advertising-control-refresh/direct_tracking_summary.json data/direct_tracking_summary.json
          cp /tmp/advertising-control-refresh/direct_source_audit.json data/direct_source_audit.json
          cp /tmp/advertising-control-refresh/metrika_52597240.json data/metrika_52597240.json
          cp /tmp/advertising-control-refresh/metrika_status.json data/metrika_status.json
          git add data/dashboard.json data/direct_status.json data/direct_report.tsv data/direct_tracking_diagnostic.json data/direct_tracking_summary.json data/direct_source_audit.json data/metrika_52597240.json data/metrika_status.json
          if git diff --cached --quiet; then
            echo "No dashboard data changes"
          else
            git commit -m "Refresh Advertising Control data"
            git push origin main
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p public-site
          cp index.html public-site/index.html
          cp .nojekyll public-site/.nojekyll
          cp -R assets public-site/assets
          cp -R data public-site/data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
