name: Direct Tracking Read-Only Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/direct-tracking-readonly.yml"
      - "scripts/direct_tracking_readonly.py"

permissions:
  contents: write

concurrency:
  group: direct-tracking-readonly
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Direct ad tracking configuration
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
          YANDEX_DIRECT_CLIENT_LOGIN: e-20027205
        run: python scripts/direct_tracking_readonly.py

      - name: Save diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/direct_tracking_diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "Refresh Direct tracking diagnostic"
            git pull --rebase --autostash origin main
            git push origin main
          fi
